<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Histórico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/paginas.css') }}">
</head>
<body>
    <div class="container">
        <h2>Gestión de Histórico</h2>

        <form method="POST">
            <fieldset>
                <legend>Actualizar periodo</legend>

                <input type="text" name="periodo" placeholder="Ingrese periodo actual" value="{{ periodo }}" required>

                <button type="submit">Actualizar al siguiente periodo</button>
            </fieldset>
        </form>

        {% if mensaje %}
            <p>{{ mensaje }}</p>
        {% endif %}

        {% if historico %}
            <h3>Registros del Histórico</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nombre Completo</th>
                        <th>Estado</th>
                        <th>Periodo</th>
                    </tr>
                </thead>
                <tbody>
                    {% for h in historico %}
                    <tr>
                        <td>{{ h.NombreCompleto }}</td>
                        <td>{{ h.estado }}</td>
                        <td>{{ h.Periodo }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% endif %}

        <form action="{{ url_for('inicio') }}" method="GET">
            <button type="submit">Volver al inicio</button>
        </form>
    </div>
</body>
</html>
